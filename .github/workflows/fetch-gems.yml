name: Fetch gem data

# One-click gem-data refresh (Actions tab -> "Fetch gem data" -> Run workflow).
# Runs `npm run fetch-gems` against the poewiki Cargo export on a normal-egress
# runner (the dev sandbox can't reach poewiki), verifies the merged gems.json
# still passes the test suite, and pushes it to a gem-data/<run> branch — open
# the PR from the link on the run's summary page (main only takes PRs). Nobody has
# to run Node locally to keep gem sources current.
on:
  workflow_dispatch:
    inputs:
      include_uncurated:
        description: Also add gems not yet curated in gems.json (--all)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts skips the Electron binary postinstall — not needed for
      # a Node-only fetch + tests, and it makes the run much faster.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Who hands each quest reward over isn't on the wiki; the game files
      # have it. pathofexile-dat (pinned) reads the tables it needs from GGG's
      # patch server for the current patch. Best-effort: if it fails, the
      # fetch below runs without NPCs, as before.
      - name: Export quest rewards from the game files
        continue-on-error: true
        run: |
          mkdir -p game && cd game
          patch="$(curl -fsS https://raw.githubusercontent.com/poe-tool-dev/latest-patch-version/main/latest.txt)"
          cat > config.json <<JSON
          {
            "patch": "$patch",
            "translations": ["English"],
            "tables": [
              { "name": "Quest", "columns": ["Name", "Act"] },
              { "name": "QuestRewardOffers", "columns": ["Id", "QuestKey"] },
              { "name": "QuestRewards", "columns": ["RewardOffer", "Reward"] },
              { "name": "NPCTalk", "columns": ["NPCKey", "QuestRewardOffersKey"] },
              { "name": "NPCs", "columns": ["Name"] },
              { "name": "BaseItemTypes", "columns": ["Id", "Name"] }
            ]
          }
          JSON
          npx -y pathofexile-dat@16.0.1

      - name: Fetch gem sources from the wiki
        run: |
          args=(--game-tables game/tables/English)
          if [[ "${{ inputs.include_uncurated }}" == "true" ]]; then args+=(--all); fi
          npm run fetch-gems -- "${args[@]}"

      # Guard: the merged gems.json must still satisfy the test suite before it
      # may land on main.
      - name: Verify
        run: npm test

      - name: Push updated gem data to a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet data/gems.json; then
            echo "gems.json unchanged — nothing to commit."
            exit 0
          fi
          branch="gem-data/${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/gems.json
          git commit -m "Update gem sources from poewiki (Fetch gem data workflow)"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$branch"
          url="https://github.com/${{ github.repository }}/compare/main...$branch?expand=1"
          echo "Pushed $branch — open the PR: $url"
          echo "Updated gem data is on \`$branch\`: [open the pull request]($url)" >> "$GITHUB_STEP_SUMMARY"
