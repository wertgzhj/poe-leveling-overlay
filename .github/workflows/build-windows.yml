name: Build Windows

# Produces the double-clickable Windows build on a Windows runner (electron-builder
# can't build a Windows target from Linux without wine).
#
#  - Manual run (Actions tab -> Run workflow): a DEV build. Uploads the exes as a
#    run artifact only — no release, and the version stays package.json's 0.0.0.
#  - Push a v* tag (e.g. v0.1.0): a RELEASE build. The version comes FROM THE TAG
#    (0.1.0), and the exes are attached to a GitHub Release. package.json is never
#    bumped for dev.
#  - A tag with a prerelease suffix (v0.15.0-beta.1) builds the BETA app instead:
#    its own identity, installed beside the stable one, published as a GitHub
#    pre-release. See "beta" below and CONTRIBUTING.md.
on:
  workflow_dispatch:
    inputs:
      beta:
        description: 'Build the Beta app (installs beside the stable one, own settings)'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate icons
        run: npm run make-icon

      - name: Typecheck
        run: npm run typecheck

      - name: Bundle (main + preload + renderer)
        run: npm run build

      # Dev (manual) builds keep package.json's version (0.0.0). Tag builds take
      # the version from the tag (v0.1.0 -> 0.1.0) without committing a bump.
      #
      # The beta overrides give the app a second identity, and all three are
      # load-bearing for different reasons:
      #   appId              -> Windows installs it BESIDE the stable build
      #                         instead of upgrading over it.
      #   productName        -> what the installer and the shortcut say.
      #   extraMetadata.name -> the userData folder. This is the one that
      #                         matters: Electron derives userData from
      #                         app.getName(), which reads the packaged
      #                         package.json — NOT the appId. Without it the
      #                         beta writes its settings and per-character
      #                         progress straight into the real ones.
      # publish.channel=beta makes electron-builder emit beta.yml, which is what
      # a 0.15.0-beta.1 app asks its update feed for.
      - name: Package Windows installer + portable exe
        shell: bash
        env:
          BETA_INPUT: ${{ inputs.beta }}
        run: |
          args=(--win --config electron-builder.yml --publish never)
          beta=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            args+=(-c.extraMetadata.version="$version")
            # Spelled out rather than `[[ … ]] && beta=true`: that form leaves a
            # non-zero status behind, and this step runs under `set -e`.
            if [[ "$version" == *-* ]]; then beta=true; fi
          elif [[ "$BETA_INPUT" == "true" ]]; then
            beta=true
          fi
          if [[ "$beta" == true ]]; then
            args+=(
              -c.appId=com.poelevelingoverlay.beta
              -c.productName="PoE Leveling Overlay Beta"
              -c.extraMetadata.name=poe-leveling-overlay-beta
              -c.nsis.shortcutName="PoE Leveling Overlay Beta"
              -c.publish.channel=beta
              # Single-quoted: ${version}/${ext} are electron-builder's
              # placeholders, and the shell must not touch them.
              -c.win.artifactName='PoE-Leveling-Overlay-Beta-${version}-setup.${ext}'
              -c.portable.artifactName='PoE-Leveling-Overlay-Beta-${version}-portable.exe'
            )
          fi
          echo "beta build: $beta"
          npx electron-builder "${args[@]}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            dist/*.exe
          if-no-files-found: error

      # The channel yml + the .blockmap must be on the release for the in-app
      # updater (electron-updater) to see the new version and download it. Both
      # names are listed because the channel follows the version: a stable build
      # reads latest.yml, a -beta.N build reads beta.yml. Missing patterns are
      # skipped, so only the one that was built gets uploaded — and listing them
      # by name keeps electron-builder's builder-debug.yml off the release.
      - name: Publish release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # A tag with a prerelease suffix must be flagged as one, or stable
          # installs will treat the beta as their next update.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
            dist/beta.yml
          generate_release_notes: true
