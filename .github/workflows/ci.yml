name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: CI checks code, it never writes to the repo.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Bundle
        run: npm run build

      # Screenshots of the overlay in fixed scenarios (scripts/render-check/),
      # attached to the run: a PR's look can be checked without running it.
      - name: Render check
        timeout-minutes: 5
        run: xvfb-run -a npm run render-check

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: render-check
          path: out/render-check/*.png
          if-no-files-found: ignore

      # What ships must be free of known advisories: this one fails the run.
      - name: Audit (production deps)
        run: npm audit --omit=dev

      # Build-time tools (electron-builder & co.) run here, not in a release:
      # their advisories are shown, not blocking.
      - name: Audit (all deps, informational)
        run: npm audit
        continue-on-error: true
