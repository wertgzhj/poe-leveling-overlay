name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Bundle
        run: npm run build

      # Screenshots of the overlay in fixed scenarios (scripts/render-check/),
      # attached to the run: a PR's look can be checked without running it.
      - name: Render check
        run: xvfb-run -a npm run render-check

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-check
          path: out/render-check/*.png
          if-no-files-found: ignore

      - name: Audit (production deps)
        run: npm audit --omit=dev
        continue-on-error: true
